[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-onsite-adap"
dynamic = ["version"]   # 버전은 src/dr_onsite_adap/_version.py 단일 소스에서 읽음
description = "Depalletizing vision: RGB-D top-face pick-pose detection + active-learning training loop"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Doosan Robotics" }]
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "torch",
    "rfdetr",
    "plotly>=5.0",
]

[project.optional-dependencies]
# Active-learning labeling (SAM) used by the live app's 't' key.
label = ["segment-anything"]
# Training pipeline (LoRA fine-tune + merge). pycocotools / faster-coco-eval
# are pulled in indirectly by rfdetr's COCO dataset loader + mAP metric.
train = ["peft", "pytorch-lightning", "pycocotools", "faster-coco-eval"]
# Camera backends — install whichever device you use. pyorbbecsdk often has
# no PyPI wheel; build from https://github.com/orbbec/pyorbbecsdk if so.
realsense = ["pyrealsense2"]
orbbec = ["pyorbbecsdk"]
# Desktop GUI (dr-onsite-gui). PySide6 = official Qt-for-Python (Qt6).
gui = ["PySide6"]

[project.scripts]
# Runtime
dr-onsite-run = "dr_onsite_adap.runtime.app:main"
dr-onsite-gui = "dr_onsite_adap.runtime.gui:main"
# Pipeline
dr-onsite-ingest = "dr_onsite_adap.pipeline.ingest:main"
dr-onsite-replay = "dr_onsite_adap.pipeline.replay:main"
dr-onsite-train = "dr_onsite_adap.pipeline.train_lora:main"
dr-onsite-merge = "dr_onsite_adap.pipeline.merge:main"
dr-onsite-eval = "dr_onsite_adap.pipeline.eval:main"
dr-onsite-dataset = "dr_onsite_adap.pipeline.dataset:main"
dr-onsite-round = "dr_onsite_adap.pipeline.round:main"

[tool.setuptools.dynamic]
version = { attr = "dr_onsite_adap._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
